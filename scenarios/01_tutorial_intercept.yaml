# Tutorial Mission: Basic Intercept & Dock
# Learn the basics of navigation, autopilot, and docking

name: "Tutorial: Intercept and Dock"
description: "Learn to use sensors and autopilot to rendezvous with and dock at a station"

dt: 0.1

ships:
  - id: "player"
    name: "Rocinante"
    class: "corvette"
    player_controlled: true
    position: {x: 0, y: 0, z: 0}
    velocity: {x: 0, y: 0, z: 0}
    mass: 5000
    systems:
      propulsion:
        max_thrust: 500000   # 500 kN Epstein drive — 10.2G max for a 5t corvette
        fuel_level: 10000
        max_fuel: 10000
      sensors:
        passive:
          range: 500000  # 500km — enough to detect station at ~427km
        active:
          scan_range: 500000
      navigation: {}
      targeting: {}
      docking:
        docking_range: 50       # metres
        max_relative_velocity: 1.0  # m/s

  - id: "target_station"
    name: "Tycho Station"
    class: "station"
    position: {x: 400000, y: 150000, z: 0}  # ~427km away
    velocity: {x: 0, y: 0, z: 0}  # Stationary
    mass: 100000
    systems:
      sensors:
        passive:
          range: 100000

  # -- Navigation buoys for spatial orientation --
  - id: "nav_origin"
    name: "Nav-Origin"
    ship_class: "beacon"
    faction: "navigation"
    player_controlled: false
    ai_enabled: false
    position: {x: 0, y: 0, z: 0}
    velocity: {x: 0, y: 0, z: 0}
  - id: "nav_midpoint"
    name: "Midpoint"
    ship_class: "beacon"
    faction: "navigation"
    player_controlled: false
    ai_enabled: false
    position: {x: 200000, y: 75000, z: 0}
    velocity: {x: 0, y: 0, z: 0}
  - id: "nav_station_approach"
    name: "Station-Approach"
    ship_class: "beacon"
    faction: "navigation"
    player_controlled: false
    ai_enabled: false
    position: {x: 380000, y: 140000, z: 0}
    velocity: {x: 0, y: 0, z: 0}

mission:
  name: "First Contact"
  description: "Rendezvous with Tycho Station and dock"

  briefing: |
    Welcome, pilot. This is a training mission to familiarize you with
    the basic systems of your ship.

    Your objective is to rendezvous with Tycho Station, currently ~430km
    away, and dock with it. The station is stationary, so use the
    "rendezvous" autopilot mode for a smooth approach.

    Steps:
    1. Use sensors to detect the station
    2. Target the station contact
    3. Engage autopilot in rendezvous mode to approach
    4. When within 5km, request docking with the same station contact
       This is an approach milestone, not the final docking range
    5. The docking system will complete the dock automatically
       once you are at most 50 m away and relative speed is at most 1 m/s
    6. After docking, manually set Helm thrust to zero and confirm actual output
       Docking does not establish an automatic thrust cutoff; drive and fuel
       use can continue while the ship is held at the station

    Use the Docking crew guide in Mission Objectives for the existing Helm
    and Engineering controls. Solo pilots must explicitly change stations;
    CPU ASSIST does not replace a complete crew or manage the drive governor.

    Good luck!

  objectives:
    - id: "detect_station"
      type: "scan_target"
      description: "Detect the station with sensors"
      required: true
      params:
        target: "target_station"

    - id: "close_to_5km"
      type: "reach_range"
      description: "Close to within 5km of the station"
      required: true
      params:
        target: "target_station"
        range: 5000
        initial_range: 427000

    - id: "dock_with_station"
      type: "dock_with"
      description: "Request docking and dock with Tycho Station"
      required: true
      params:
        target: "target_station"

  success_message: |
    Excellent work! You've successfully docked with Tycho Station.

    After docking, manually set Helm thrust to zero and confirm actual output.
    Docking can hold the ship at the station while drive and fuel use continue.

    You've learned:
    - How to use passive sensors to detect contacts
    - How to lock a target
    - How to engage the rendezvous autopilot
    - How to request and complete a docking maneuver

    Ready for the next mission?

  failure_message: "Training failed. Review the briefing and try again."

  next_scenario: "02_combat_destroy"

  hints:
    - trigger: "start"
      message: "Use the sensors panel to detect nearby contacts"
    - trigger: "range < 200000"
      target: "target_station"
      message: "You're halfway there. The autopilot will handle the flip-and-burn deceleration automatically."
    - trigger: "range < 50000"
      target: "target_station"
      message: "Getting close! The autopilot is decelerating for final approach."
    - trigger: "range < 5000"
      target: "target_station"
      message: "Approach milestone reached. Request docking with the station contact; the final dock requires at most 50 m and 1 m/s relative speed. After docking, manually set Helm thrust to zero and confirm actual output."
