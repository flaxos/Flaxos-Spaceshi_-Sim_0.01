name: Shared ship checks

on:
  pull_request:
  push:
    branches: [main, codex/trustworthy-shared-ship]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      # Preserve full-suite failures, including the known enemy-fire flake.
      - run: python -m pytest tests/ -q

  svelte:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui-svelte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gui-svelte/package-lock.json
      - run: npm ci
      - name: Install Chromium for native component regressions
        run: node node_modules/playwright/cli.js install --with-deps chromium
        working-directory: .
      - run: npm test
      - run: npm run check
      - run: npm run build
